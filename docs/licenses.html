<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开源许可 · 拼豆工坊</title><style>body{font:15px/1.9 -apple-system,"Microsoft YaHei",sans-serif;max-width:750px;margin:45px auto;padding:0 24px;color:#294132;background:#f4f8f4}a{color:#079551}h1{font-size:25px}</style><h1>色卡来源与开源许可</h1><p>拼豆工坊转换与界面逻辑独立实现。色卡使用社区维护的参考 RGB，并不宣称是厂家最新完整色卡。屏幕、批次、光线和熨烫都会影响实物颜色。</p><p>色卡来自 <a href="https://github.com/maxcleme/beadcolors">maxcleme/beadcolors</a>，使用 MIT 许可。<a href="licenses/beadcolors-MIT.txt">许可全文</a> · <a href="assets/palette-source.json">源版本记录</a>。</p><p>浏览器主体分割使用 <a href="https://opencv.org/">OpenCV.js</a> 4.9.0，使用 Apache-2.0 许可。<a href="licenses/OpenCV-Apache-2.0.txt">许可全文</a> · <a href="vendor/SOURCE.json">组件版本与校验值</a>。</p><p>照片仅在你的浏览器中处理，不发送到服务器。不支持本地解压的旧浏览器加载官方抠图组件时会访问 OpenCV 站点，但不会发送照片。</p><a href="./">返回拼豆工坊</a></html>
